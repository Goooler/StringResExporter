[versions]
jdkRelease = "17"
kotlin = "2.3.10"

[libraries]
poi = "org.apache.poi:poi:5.5.1"
jdom2 = "org.jdom:jdom2:2.0.6.1"
clikt = "com.github.ajalt.clikt:clikt:5.1.0"

r8 = "com.android.tools:r8:9.0.32"

junit-bom = "org.junit:junit-bom:6.0.2"
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-systemExit = "com.ginsberg:junit5-system-exit:1.1.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"

# Dummy to get renovate updates, the version is used in rootProject build.gradle with spotless.
ktlint = "com.pinterest.ktlint:ktlint-cli:1.8.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
buildconfig = "com.github.gmazzo.buildconfig:6.0.7"
shadow = "com.gradleup.shadow:9.3.1"
spotless = "com.diffplug.spotless:8.2.1"
