[versions]
jdkRelease = "11"
kotlin = "2.2.20"

[libraries]
poi = "org.apache.poi:poi:5.4.1"
jdom2 = "org.jdom:jdom2:2.0.6.1"
clikt = "com.github.ajalt.clikt:clikt:5.0.3"

r8 = "com.android.tools:r8:8.12.14"

junit-bom = "org.junit:junit-bom:5.13.4"
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-systemExit = "com.ginsberg:junit5-system-exit:1.1.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"

# Dummy to get renovate updates, the version is used in rootProject build.gradle with spotless.
ktlint = "com.pinterest.ktlint:ktlint-cli:1.7.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
buildconfig = "com.github.gmazzo.buildconfig:5.6.8"
shadow = "com.gradleup.shadow:9.2.1"
spotless = "com.diffplug.spotless:8.0.0"
